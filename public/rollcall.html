    function parseImportedSchoolWorkbook(workbook) {
      const sheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[sheetName];
      if (!worksheet) throw new Error("Excel 沒有可讀取的工作表。");
      const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, defval: "" })
        .map(row => row.map(cleanImportedCell));
      const headerRows = rows
        .map((row, index) => ({ row, index }))
        .filter(item => item.row.filter(value => value === "座號").length >= 2 && item.row.includes("姓名"))
        .map(item => item.index);
      if (!headerRows.length) throw new Error("找不到班級名冊欄位，請確認格式與目前的全校學生名單相同。");

      const phoneLabels = new Set(["電話", "聯絡電話", "家長電話", "手機", "行動電話"]);
      const students = [];
      const classNames = new Set();
      const classesWithoutPhone = new Set();

      headerRows.forEach((headerIndex, headerPosition) => {
        const header = rows[headerIndex] || [];
        const title = rows[headerIndex - 1] || [];
        const nextHeaderIndex = headerRows[headerPosition + 1] ?? rows.length;
        const starts = [];
        header.forEach((label, columnIndex) => {
          if (label === "座號") starts.push(columnIndex);
        });
        starts.forEach((startColumn, blockIndex) => {
          const endColumn = starts[blockIndex + 1] ?? Math.max(header.length, title.length);
          const labels = header.slice(startColumn, endColumn);
          const className = cleanImportedCell(title[startColumn]);
          const nameOffset = labels.indexOf("姓名");
          const idOffset = labels.indexOf("學號");
          const seatOffset = labels.indexOf("座號");
          const genderOffset = labels.indexOf("性別");
          const phoneOffset = labels.findIndex(label => phoneLabels.has(label));
          if (!className || nameOffset < 0 || seatOffset < 0) return;
          if (isExcludedClass(className)) return;
          classNames.add(className);
          if (phoneOffset < 0) classesWithoutPhone.add(className);

          for (let rowIndex = headerIndex + 1; rowIndex < nextHeaderIndex; rowIndex++) {
            const row = rows[rowIndex] || [];
            const name = cleanImportedCell(row[startColumn + nameOffset]);
            if (!name || name === "姓名" || name.startsWith("導師") || ["應到人數", "實到人數"].includes(name)) continue;
            students.push({
              id: idOffset >= 0 ? normalizeImportedId(row[startColumn + idOffset]) : "",
              name,
              className,
              seat: normalizeImportedId(row[startColumn + seatOffset]),
              gender: genderOffset >= 0 ? cleanImportedCell(row[startColumn + genderOffset]) : "",
              phone: phoneOffset >= 0 ? normalizeImportedPhone(row[startColumn + phoneOffset]) : "",
              sourceRow: rowIndex + 1,
              status: "active",
              entryDate: data.term.start,
            });
          }
        });
      });

      return {
        sheetName,
        students,
        classNames: [...classNames],
        classesWithoutPhone: [...classesWithoutPhone],
      };
    }
    function buildRosterImportPreview(parsed, fileName) {
      const errors = [];
      const warnings = [];
      const idSeen = new Map();
      const seatSeen = new Map();
      const currentStudents = allStudents();
      const currentById = new Map(currentStudents.map(student => [studentKey(student), student]));

      parsed.students.forEach(student => {
        if (!student.id) addImportIssue(errors, `第 ${student.sourceRow} 列：${student.className} ${student.name} 缺少學號。`);
        if (!student.className) addImportIssue(errors, `第 ${student.sourceRow} 列：${student.name || "未命名學生"} 缺少班級。`);
        if (!student.seat) addImportIssue(errors, `第 ${student.sourceRow} 列：${student.className} ${student.name} 缺少座號。`);
        if (!student.name) addImportIssue(errors, `第 ${student.sourceRow} 列缺少姓名。`);
        if (student.id) {
          if (idSeen.has(student.id)) addImportIssue(errors, `學號 ${student.id} 重複：第 ${idSeen.get(student.id)}、${student.sourceRow} 列。`);
          else idSeen.set(student.id, student.sourceRow);
        }
        const seatKey = `${student.className}|${student.seat}`;
        if (student.className && student.seat) {
          if (seatSeen.has(seatKey)) addImportIssue(errors, `${student.className} 座號 ${student.seat} 重複。`);
          else seatSeen.set(seatKey, student.sourceRow);
        }
      });

      if (!parsed.students.length) errors.push("Excel 中沒有可匯入的學生。");
      if (parsed.classesWithoutPhone.length) {
        warnings.push(`以下班級沒有電話欄：${parsed.classesWithoutPhone.join("、")}。匯入時將保留同學號的現有電話。`);
      }
      const missingPhones = parsed.students.filter(student => !student.phone).length;
      if (missingPhones) warnings.push(`${missingPhones} 位學生未填電話；同學號學生會保留現有電話。`);

      const students = parsed.students.map(student => {
        const current = currentById.get(student.id);
        return {
          ...student,
          phone: student.phone || current?.phone || "",
        };
      });
      const importedById = new Map(students.filter(student => student.id).map(student => [student.id, student]));
      const changes = [];
      let addedCount = 0;
      let changedCount = 0;
      let unchangedCount = 0;

      students.forEach(student => {
        const current = currentById.get(student.id);
        if (!current) {
          addedCount++;
          changes.push({ kind: "新增", before: null, after: student });
          return;
        }
        const fields = ["name", "className", "seat", "phone"];
        const changedFields = fields.filter(field => cleanImportedCell(current[field]) !== cleanImportedCell(student[field]));
        if (changedFields.length) {
          changedCount++;
          changes.push({ kind: "異動", before: current, after: student, changedFields });
        } else {
          unchangedCount++;
        }
      });

      let removedCount = 0;
      currentStudents.forEach(student => {
        const key = studentKey(student);
        if (!importedById.has(key)) {
          removedCount++;
          changes.push({ kind: "不續用", before: student, after: null });
        }
      });

      const classCounts = [...students.reduce((map, student) => {
        map.set(student.className, (map.get(student.className) || 0) + 1);
        return map;
      }, new Map()).entries()]
        .sort((a, b) => a[0].localeCompare(b[0], "zh-Hant"))
        .map(([name, count]) => ({ name, count }));

      return {
        fileName,
        sheetName: parsed.sheetName,
        students,
        classCounts,
        changes,
        errors,
        warnings,
        addedCount,
        changedCount,
        unchangedCount,
        removedCount,
      };
    }

    function studentByMember(member) {
      if (isExcludedClass(member.className)) return null;
      if (member.studentId) return allStudents().find(s => s.id === member.studentId);

    }
    function afterCareRecordForStudent(student, dateText = state.date, record = dayRecord(dateText)) {
      if (!student) return null;
      const key = studentKey(student);
      const member = afterCareMembersForDisplay(dateText).find(m => memberKey(m) === key || m.studentId === student.id || (m.name === student.name && m.className === student.className));
      return member ? (record.afterCare?.[memberKey(member)] || {}) : null;
    }
    function clubAbsenceFollowContext(member, dateText = state.date, record = dayRecord(dateText)) {
      const student = studentByMember(member);
      const morning = student ? (record.morning?.[studentKey(student)] || {}) : {};
      const afterCare = student ? afterCareRecordForStudent(student, dateText, record) : null;
      const afterCareSupportsFollow = afterCare === null || afterCare.status === "present";
      return {
        morning,
        afterCare,
        shouldFollow: !["personal", "sick"].includes(morning.status) && afterCareSupportsFollow,
      };
    }
    function clubMembersForDisplay(club, dateText = state.date) {
      return effectiveClubMembers(club).filter(member => {
        if (isExcludedClass(member.className) || !studentByMember(member)) return false;
        const rec = clubMemberRecord(club.name, memberKey(member));
        if (rec.joinDate && dateText < rec.joinDate) return false;
        if (rec.dropDate && dateText >= rec.dropDate) return false;
        if (rec.status === "dropped" && !rec.dropDate) return false;
        return true;
      });
    }
    function effectiveClubMembers(club) {
      const added = rosterStore().addedClubMembers?.[club.name] || [];
      const seen = new Set();
      return club.members.concat(added).filter(member => {
        const key = memberKey(member);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }
    function phoneForStudentKey(key) {
      const student = findStudentByKey(key);
      if (student?.phone) return student.phone;
      for (const club of data.clubs) {
        const member = club.members.find(m => memberKey(m) === key || m.studentId === key);
        if (member?.phone) return member.phone;
      }
      if (!student) return "";
      for (const club of data.clubs) {

    function renderDashboard() {

          const rec = record.morning?.[studentKey(s)] || {};

    function clubRosterChangeTable(dates) {
      if (!dates.length) return `<div class="empty">目前沒有社團加退選異動。</div>`;
      const startDate = dates[0];
      const endDate = dates[dates.length - 1];
      const rows = [];
      data.clubs.forEach(club => {
        effectiveClubMembers(club).forEach(member => {
          if (isExcludedClass(member.className) || !studentByMember(member)) return;
          const key = memberKey(member);
          const rec = clubMemberRecord(club.name, key);
          if (rec.joinDate && rec.joinDate > clubTermStart && rec.joinDate >= startDate && rec.joinDate <= endDate) {
            rows.push({ club, member, date: rec.joinDate, kind: "加入", pill: statusPill(rec.joinDate > state.date ? "info" : "ok", rec.joinDate > state.date ? "預計加入" : "已加入") });
          }
          if (rec.status === "dropped" && rec.dropDate && rec.dropDate >= startDate && rec.dropDate <= endDate) {
            rows.push({ club, member, date: rec.dropDate, kind: "退選", pill: statusPill(rec.dropDate > state.date ? "warn" : "danger", rec.dropDate > state.date ? "預計退選" : "已退選") });
          }
        });
      });
      rows.sort((a, b) => a.date.localeCompare(b.date) || a.club.name.localeCompare(b.club.name) || a.member.className.localeCompare(b.member.className));
      if (!rows.length) return `<div class="empty">目前沒有社團加退選異動。</div>`;
      return `
        <table>
          <thead><tr><th>日期</th><th>社團</th><th>學生</th><th>異動</th><th>狀態</th></tr></thead>
          <tbody>${rows.map(row => `
            <tr>
              <td>${escapeHtml(row.date)}</td>
              <td>${escapeHtml(row.club.name)}</td>
              <td><div class="name">${escapeHtml(row.member.name || "")}</div><div class="sub">${escapeHtml(row.member.className || "")} ${escapeHtml(row.member.studentId || "")}</div></td>
              <td>${escapeHtml(row.kind)}</td>
              <td>${row.pill}</td>
            </tr>
          `).join("")}</tbody>
        </table>
      `;
    }
    function classOptions() {

          return;

        error.style.display = "none";

        render();

      document.getElementById("loginBtn").onclick = submitLogin;

    function morningStatDefsForRange(range) {
      return range === "today"

      if (status === "unknown" || status === "notMarked" || status === "other") return "warn";
      if (status === "late") return "danger";
      return "info";
    }
    function morningStatBucket(status, range) {
      if (range === "today") return status || "notMarked";
      if (status === "personal" || status === "sick") return status;
      if (status && status !== "present") return "other";
      return "";

            if (!itemsByStatus[status]) itemsByStatus[status] = [];
            itemsByStatus[status].push({ date: dateText, student: s, rec, status, rawStatus: rec.status || "notMarked" });
          });
      });
      return { dates, itemsByStatus };

      const fallbackKeys = resultKeys.filter(key => {
        const rec = morningRecordForKey(key);
        const isAdministrative = rec.registeredBy === "admin" || (!rec.registeredBy && adminLeaveSources.includes(rec.source));
        return ["personal", "sick", "unknown"].includes(rec.status) && isAdministrative;

      const key = activeKey || (fallbackKeys.length === 1 ? fallbackKeys[0] : "");
      if (!key) {

        render();

          const key = memberKey(member);
          const afterCare = record.afterCare?.[key] || {};
          if (afterCare.status !== "absent") return;
          const student = studentByMember(member);
          const morning = student ? (record.morning?.[studentKey(student)] || {}) : {};
          if (["personal", "sick"].includes(morning.status)) return;
          rows.push({
            date: dateText,
            key,
            member,
            afterCare,
            morning,

      });
      return rows;

        state.view = "club";
      }
      if (currentUser.role === "afterCareTeacher") {
        state.view = "afterCare";
      }
      if (currentUser.role === "admin") {
        const availableClasses = [...new Set(activeStudents().map(student => student.className))];
        if (availableClasses.length && !availableClasses.includes(state.className)) state.className = availableClasses[0];
      }
      buildNav();
      const view = views.find(v => v.id === state.view) || views[0];
      const viewTitle = document.getElementById("viewTitle");
      const viewMeta = document.getElementById("viewMeta");
      const metaText = baseMeta();
      const mobileViewTitle = document.getElementById("mobileViewTitle");
      if (mobileViewTitle) mobileViewTitle.textContent = view.navTitle || view.title;
      updateMobileMenuState();
      viewTitle.classList.toggle("club-main-title", state.view === "pickup");
      if (state.view === "pickup") {
        viewTitle.innerHTML = `115-1課外社團<span class="club-subtitle">${escapeHtml(metaText)}</span>`;
      } else {
        viewTitle.textContent = view.title;
      }
      if (state.view === "pickup") {
        viewMeta.textContent = "";
      } else if (state.view === "morning") {
        viewMeta.innerHTML = morningMetaHtml();
      } else {
        viewMeta.textContent = metaText;
      }
      document.getElementById("dateInput").value = state.date;
      document.getElementById("termLabel").textContent = `${data.term.label}｜${data.term.start} - ${data.term.end}`;
      const app = document.getElementById("app");
      if (state.view === "morning") app.innerHTML = renderMorning();
      else if (state.view === "leave") app.innerHTML = renderLeave();
      else if (state.view === "afterCare") app.innerHTML = renderAfterCare();
      else if (state.view === "club") app.innerHTML = renderClub();
      else if (state.view === "follow") app.innerHTML = renderFollow();
      else if (state.view === "pickup") app.innerHTML = renderPickupPanel(true);
      else if (state.view === "teachingFollow") app.innerHTML = renderTeachingFollowPanel(true);
      else if (state.view === "pickup19") app.innerHTML = renderPickupPanel(true, [state.date], { bucket: "pickup19", title: "19:00 未接回學生", searchProp: "pickup19Search", defaultTime: "19:00" });
      else if (state.view === "classRoster") app.innerHTML = renderClassRoster();
      else if (state.view === "clubRoster") app.innerHTML = renderClubRoster();
      else if (state.view === "afterCareRoster") app.innerHTML = renderAfterCareRoster();
      else if (state.view === "rosterImport") app.innerHTML = renderRosterImport();
      else app.innerHTML = renderDashboard();
      bindEvents();
      if (preserveScroll) {
        const restore = () => restoreScrollState(scrollState, options.keepMorningKey || "");
        requestAnimationFrame(() => {
          restore();
          requestAnimationFrame(restore);
          setTimeout(restore, 80);
        });
      }
    }
    document.getElementById("mobileMenuToggle")?.addEventListener("click", () => {
      state.mobileMenuOpen = !state.mobileMenuOpen;
      updateMobileMenuState();
    });
    document.getElementById("mobileMenuBackdrop")?.addEventListener("click", closeMobileMenu);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && state.mobileMenuOpen) closeMobileMenu();
    });
    document.getElementById("dateInput").min = data.term.start;
    document.getElementById("dateInput").max = data.term.end;
    document.getElementById("dateInput").addEventListener("change", e => {
      state.date = e.target.value;
      warnForNonSchoolDate(state.date);
      render();
    });
    document.getElementById("clearBtn").addEventListener("click", () => {
      if (!confirm(`確定清除 ${state.date} 的點名紀錄？名冊資料不會被刪除。`)) return;
      delete records[state.date];
      saveRecordsImmediately();
      render();
    });
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem(userStorageKey);
      currentUser = { role: "guest", className: "" };
      state.view = "dashboard";
      state.mobileMenuOpen = false;
      render();
    });
    document.getElementById("exportBtn").addEventListener("click", () => {
      const payload = { date: state.date, records: day(), exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `attendance-${state.date}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });
    render();
    setupCloudSync();
  </script>
